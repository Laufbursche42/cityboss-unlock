<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="pageTitle">Laufbursche CITYBOSS Tool</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Laufbursche <span data-t="brandSub"></span></h1>
    <div class="head-right">
      <span class="status" id="status" data-state="disconnected">disconnected</span>
      <div class="head-tools">
        <button type="button" class="theme-btn" id="btn-theme">&#9728;</button>
        <div class="langs" id="langs" role="group">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

<p class="hint infobox" data-t="infoBannerHtml"></p>

  <p class="warn" id="platform-note" data-t="platformNote" hidden></p>

  <div class="card">
    <h2 data-t="s1Title"></h2>
    <p class="hint" data-t="sub"></p>
    <p class="hint" data-t="startHintGuide"></p>
    <p class="warn" data-t="expWarn"></p>
    <p class="hint" data-t="ownDevice"></p>
  </div>

  <div class="card">
    <h2 data-t="s2Title"></h2>
    <div class="log-opt">
      <span data-t="showallLabel"></span>
      <input type="checkbox" id="showall">
    </div>
    <div class="set-row">
      <label for="pin-in" data-t="pinLabel"></label>
      <input type="text" id="pin-in" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="0000">
    </div>
    <p class="hint" data-t="pinHint"></p>
    <div class="btns">
      <button class="primary span2" id="btn-conn" data-t="btnConnect"></button>
    </div>
    <p class="hint" id="devinfo"></p>
    <p class="hint" id="enc-state"></p>
    <p class="hint" data-t="controlsHint"></p>
  </div>

  <div class="card" id="live-card" hidden>
    <div class="card-head"><h2 data-t="liveTitle"></h2></div>
    <div class="grid" id="tiles">
      <div class="tile" id="t-speed-tile"><b id="t-speed">-</b><small data-t="tSpeed"></small></div>
      <div class="tile" id="t-batt-tile"><b id="t-batt">-</b><small data-t="tBatt"></small></div>
      <div class="tile" id="t-volt-tile"><b id="t-volt">-</b><small data-t="tVolt"></small></div>
      <div class="tile" id="t-trip-tile"><b id="t-trip">-</b><small data-t="tTrip"></small></div>
      <div class="tile" id="t-total-tile"><b id="t-total">-</b><small data-t="tTotal"></small></div>
      <div class="tile" id="t-lock-tile"><b id="t-lock">-</b><small data-t="tLock"></small></div>
    </div>
    <p class="hint" id="tiles-empty" data-t="tilesEmpty"></p>
    <p class="hint" data-t="liveHint"></p>
  </div>

  <div class="card" id="more-card" hidden>
    <div class="card-head"><h2 data-t="moreTitle"></h2><button type="button" class="help-btn" data-help="ctrl" aria-label="Info">?</button></div>

    <h3 class="set-group" data-t="setgrpSpeed"></h3>
    <label data-t="cSpeedLimit"></label>
    <div class="set-row">
      <input type="number" id="speed-kmh" min="1" max="60" step="1" value="25">
      <select id="speed-target"></select>
    </div>
    <div class="btns"><button class="span2" id="btn-setspeed" data-t="btnSetSpeed" disabled></button></div>
    <p class="hint" data-t="speedNote"></p>

    <h3 class="set-group" data-t="setgrpGeneral"></h3>
    <label data-t="cLock"></label>
    <div class="btns">
      <button id="btn-lock" data-t="btnLock" disabled></button>
      <button id="btn-unlock" data-t="btnUnlock" disabled></button>
    </div>
  </div>

  <div class="card" id="raw-card" hidden>
    <div class="card-head"><h2 data-t="expertTitle"></h2><button type="button" class="help-btn" data-help="expert" aria-label="Info">?</button></div>
    <p class="hint" data-t="expertHint"></p>

    <h3 class="set-group" data-t="eReg"></h3>
    <div class="set-row">
      <label data-t="eRegNr"></label>
      <input type="number" id="reg-nr" min="0" max="255" value="239">
      <label data-t="eRegVal"></label>
      <input type="number" id="reg-val" min="0" max="65535" value="25000">
    </div>
    <div class="btns"><button class="span2" id="btn-writereg" data-t="btnWriteReg" disabled></button></div>

    <h3 class="set-group" data-t="eRaw"></h3>
    <input type="text" id="raw-hex" class="raw-in" placeholder="55 AA 06 70 EF 00 ...">
    <div class="btns">
      <button id="btn-raw" data-t="btnRaw" disabled></button>
      <button id="btn-raw-plain" data-t="btnRawPlain" disabled></button>
    </div>
  </div>

  <div class="card">
    <h2 data-t="s6Title"></h2>
    <div class="log-opts">
      <div class="log-opt">
        <span data-t="publicLogLabel"></span>
        <input type="checkbox" id="public-log" checked>
        <button type="button" class="help-btn" data-help="publiclog" aria-label="Info">?</button>
      </div>
      <div class="log-opt">
        <span data-t="diagLogLabel"></span>
        <input type="checkbox" id="diag-log">
        <button type="button" class="help-btn" data-help="diaglog" aria-label="Info">?</button>
      </div>
    </div>
    <div class="btns">
      <button type="button" id="btn-copy-log" data-t="btnCopyLog"></button>
      <button type="button" id="btn-clear-log" data-t="btnClearLog"></button>
      <button type="button" id="btn-save-log" class="span2" data-t="btnSaveLog"></button>
    </div>
    <pre id="log"></pre>
    <p class="hint"><span class="log-tx" data-t="logTxLegend"></span>, <span class="log-rx" data-t="logRxLegend"></span></p>
  </div>

  <footer class="foot">
    <span class="foot-links">
      <a id="link-guide" href="GUIDE.de.md" data-doc="GUIDE" data-t="footGuide"></a>
      <a href="https://github.com/Laufbursche42/cityboss-unlock" target="_blank" rel="noopener" data-t="footSource"></a>
      <a id="link-readme" href="README.md" data-doc="README" data-t="footReadme"></a>
      <a id="link-disclaimer" href="#" data-t="footDisclaimer"></a>
      <a id="link-license" href="LICENSE.de.md" data-doc="LICENSE" data-t="footLicense"></a>
      <a id="link-privacy" href="PRIVACY.de.md" data-doc="PRIVACY" data-t="footPrivacy"></a>
      <a id="link-trademarks" href="TRADEMARKS.de.md" data-doc="TRADEMARKS" data-t="footTrademarks"></a>
    </span>
    <span class="foot-links"><span class="ver" id="build-ver"></span><a href="https://github.com/Laufbursche42/Laufbursche42/issues" target="_blank" rel="noopener" data-t="footIssue"></a></span>
    <a class="foot-copy" href="https://laufbursche42.github.io/Laufbursche42/" target="_blank" rel="noopener">Copyright (c) 2026 Laufbursche</a>
  </footer>
</div>

<dialog id="doc" aria-labelledby="doc-title">
  <div class="doc-head">
    <h3 id="doc-title"></h3>
    <button type="button" id="doc-x">&times;</button>
  </div>
  <div class="doc-body" id="doc-body"></div>
  <div class="doc-foot">
    <button type="button" id="doc-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="help" aria-labelledby="help-title">
  <div class="doc-head">
    <h3 id="help-title"></h3>
    <button type="button" id="help-x">&times;</button>
  </div>
  <div class="doc-body"><p id="help-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="help-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-title">
  <div class="doc-head">
    <h3 id="confirm-title" data-t="confirmTitle"></h3>
    <button type="button" id="confirm-x">&times;</button>
  </div>
  <div class="doc-body"><p id="confirm-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="confirm-no" data-t="confirmCancel"></button>
    <button type="button" id="confirm-ok" class="primary" data-t="confirmOk"></button>
  </div>
</dialog>

<script src="i18n.js?v=3"></script>
<script src="report-footer.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
